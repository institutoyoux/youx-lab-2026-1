<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pokemon</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>

    <div class="caixa">
        <div class="caixaProcurar">
            <input id="pokemon" type="text" placeholder="Digite o nome ou número do Pokémon">
            <button id="procurar">Procurar</button>
        </div>
        <div class="imagemPokemon">
            
        </div>

        <div id="carta">
            <label for="nome">Nome</label>
            <input type="text" id="nome" class="inputsJS" readonly>
            <label for="tipo">Tipo</label>
            <input type="text" id="tipo" class="inputsJS" readonly>

            <label for="vida">Vida</label>
            <input type="text" id="vida" class="inputsJS" readonly>

            <label for="habilidade">Habilidades</label>
            <input type="text" id="habilidade" class="inputsJS" readonly>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
