<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="desafio.css">
    <title>Calculadora</title>
</head>
<body>
   <form id="form" onsubmit="atualizar(event)">
        <div class="caixa1">
            <label>Digite o 1° Valor</label>
            <input type="number" id="valor1">
        </div>
        <div class="caixa2">
            <label>Digite o 2° Valor</label>
            <input type="number" id="valor2">
        </div>
        <div class="caixa3">
            <label>Resultado</label>
            <input type="text" value="0" name="res" id="res" readonly>
        </div>

        <button id="btnSoma">+</button>
        <button id="btnSubtrair">-</button>
        <button id="btnMultiplicar">x</button>
        <button id="btnDividir">/</button>
        <button id="btnPotencia">^</button>
    </form>
     <script src="desafio.js"></script>
</body>
</html>
