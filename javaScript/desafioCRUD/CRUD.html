<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="CRUD.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio CRUD</title>
</head>

<body>
    <div id="caixa1">
        <div id="titulo">Gerenciador de Tarefas Web</div>
        <div id="caixa2">
            <h2>Nova Tarefa</h2>
            <form id="form" onsubmit="tarefa(event)">
                <div class="inputs">
                    <div>
                        <label>NOME DA TAREFA</label>
                        <input id="nome" type="text">
                    </div>
                    <div>
                        <label>TIPO</label>
                        <select id="tipo">
                            <option>SELECIONE...</option>
                            <option>Trabalho</option>
                            <option>Estudo</option>
                            <option>Pessoal</option>
                        </select>
                    </div>
                    <div>
                        <label>DATA DE CADASTRO</label>
                        <input id="inicio" type="date">
                    </div>
                    <div>
                        <label>DATA PARA TÉRMINO</label>
                        <input id="final" type="date">
                    </div>
                    <div>
                        <label>STATUS</label>
                        <select id="status">
                            <option>SELECIONE...</option>
                            <option>NÃO INICIADO</option>
                            <option>EM ANDAMENTO</option>
                            <option>FINALIZADO</option>
                        </select>
                    </div>
                    <button id="criarTarefa">+ Cadastrar Tarefa</button>
                </div>
            </form>
        </div>
        <div id="caixa3">
            <table id="tabela">
                <tr class="tituloTabela">
                    <th>Tarefa</th>
                    <th>Tipo</th>
                    <th>Início</th>
                    <th>Término</th>
                    <th>Status</th>
                    <th>Prazo</th>
                    <th>Ações</th>
                </tr>
                

            </table>
            <!-- Tarefas que vão add -->
        </div>
    </div>
    <script src="CRUD.js"></script>
</body>

</html>
