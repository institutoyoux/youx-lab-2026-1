<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Monitoramento territorial</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
      }
      header {
        padding: 12px 16px;
        background: #163b50;
        color: white;
      }
      .filtros {
        display: flex;
        gap: 12px;
        padding: 12px;
        flex-wrap: wrap;
      }
      #mapa {
        height: 70vh;
        min-height: 420px;
      }
      select {
        padding: 7px;
      }
    </style>
  </head>
  <body>
    <header><h2>Monitoramento territorial</h2></header>
    <section class="filtros">
      <label
        >Município
        <select id="municipio">
          <option value="">Todos</option>
          <option>Aracruz</option>
          <option>Linhares</option>
        </select>
      </label>
      <label
        >Risco
        <select id="risco">
          <option value="">Todos</option>
          <option>Baixo</option>
          <option>Médio</option>
          <option>Alto</option>
        </select>
      </label>
      <span id="resultado"></span>
    </section>
    <div id="mapa"></div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="app.js"></script>
  </body>
</html>
