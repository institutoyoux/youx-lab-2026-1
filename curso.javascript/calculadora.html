<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <link rel="stylesheet" href="calculadora.css">
    <title>Calculadora</title>
</head>
<body>
    <div class="tituloInput">
        <label for="tituloValor">Valor 1</label>
        <input type="number" id="valor1">
    </div>

    

    <div class="tituloInput">
        <label for="tituloValor">Valor 2</label>
        <input type="number" id="valor2">
    </div>

   

    <div class="resultado">
         <label for="tituloValor">Resultado</label>
          <input id="resultado" type="text" disabled>
    </div>

   

    <div class="conteinerBotoes">
        <button id="positivo" class="botao"> + </button> 
        <button id="negativo"class="botao"> - </button>
        <button id="multiplicaçao" class="botao"> * </button>
        <button id="divisao" class="botao"> / </button>
    </div>

    <script src="calculadora.js"></script>
 
    </body>
</html>
