spring:
  application:
    name: libraryapi
  profiles:
    active: production
# SPRING_PROFILES_ACTIVE=production
  datasource:
    url: jdbc:postgresql://localhost:5433/library
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: true
    hibernate:
#      ddl-auto: update
      ddl-auto: none
    properties:
      hibernate.hibernate.format_sql: true


# production
---
spring:
  config:
    activate:
      on-profile: production
  jpa:
    show-sql: false


# homologacao
---
spring:
  config:
    activate:
      on-profile: homologacao
  jpa:
    show-sql: false
  datasource:
    url: jdbc:postgresql://localhost:5433/library