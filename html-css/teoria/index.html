<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cam</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
            href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css"/>
</head>
<body>
<div id="about-container">
    <div id="brand">
        <img src="img/logo.png" alt="logo site">
        <h1> Atletico Mineiro </h1>
        <p id="exclusive">Saiba tudo sobre o atletico mineiro !</p>
        <h2> Fique ligado em jogos, notícias e informações </h2>
    </div>
    <div id="bloco__esquerda">
        <form id="register-form">
            <div id="name-container">
                <input
                        type="text"
                        name="name"
                        id="name"
                        placeholder="Nome"/>
                <input
                        type="text"
                        name="lastname"
                        id="lastname"
                        placeholder="Sobrenome" />
                <input
                        type="text"
                        name="cpf"
                        id="cpf"
                        placeholder="cpf"
                />
            </div>
            <input type="submit" value="Cadastrar"/>
            <p> cadastre e se torne membro da nação alvinegra </p>
        </form>
    </div>

</div>
</body>
</html>
