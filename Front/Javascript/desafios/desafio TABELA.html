<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Desafio 2 Front End</title>

    <link rel="stylesheet" href="desafio%20TABELA.css">
</head>

<body>

<main>

    <div id="caixaNovaTarefa" class="caixa">

        <div id="caixaCriarTarefas" class="caixaFuncionalidades">

            <label for="nomeTarefa">NOME DA TAREFA</label>
            <input
                    type="text"
                    name="nomeTarefa"
                    id="nomeTarefa"
                    placeholder="Digite o nome da tarefa"
            >

            <label for="tipoTarefa">TIPO</label>
            <input
                    type="text"
                    name="tipoTarefa"
                    id="tipoTarefa"
                    placeholder="Digite o tipo da tarefa"
            >

            <label for="dataTarefa">DATA DE CADASTRO</label>
            <input
                    type="date"
                    name="dataTarefa"
                    id="dataTarefa"
            >

            <label for="dataTerminoTarefa">DATA PARA TÉRMINO</label>
            <input
                    type="date"
                    name="dataTerminoTarefa"
                    id="dataTerminoTarefa"
            >

            <label for="statusTarefa">STATUS</label>

            <select
                    name="statusTarefa"
                    id="statusTarefa"
            >
                <option value="nao-iniciado">NÃO INICIADO</option>
                <option value="em-andamento">EM ANDAMENTO</option>
                <option value="finalizado">FINALIZADO</option>
            </select>

            <button id="btnCadastrarTarefa">
                + Cadastrar Tarefa
            </button>

        </div>

    </div>


    <div id="caixaTarefas" class="caixa2">

        <div id="caixaEditarTarefas" class="caixaFuncionalidades">

            <button id="btnEditarTarefa">
                Editar
            </button>

            <button id="btnDeletarTarefa">
                Excluir
            </button>

            <button id="statusFinalizado">
                FINALIZADO
            </button>

            <button id="statusNaoIniciado">
                NÃO INICIADO
            </button>

            <button id="statusEmAndamento">
                EM ANDAMENTO
            </button>

            <button id="prazoEmDia">
                EM DIA
            </button>


        </div>

    </div>

</main>

<script src="desafio%20RPG.js"></script>

</body>

</html>
