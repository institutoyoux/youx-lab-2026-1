<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/html">
<head>
    <meta charset="UTF-8">
    <title>Desafio 2 Front End </title>
    <link rel="stylesheet" href="desafio%20TABELA.css">
</head>
<body>

<main>
    <div id="caixaNovaTarefa" class="caixa">
        <div id="caixaCriarTarefas" class="caixaFuncionalidades">
            <label>NOME DA TAREFA</label>
            <input type="text"
                   name="nomeTarefa"
                   id="nomeTarefa"/>

            <label>TIPO</label>
            <input type="text"
                   name="tipoTarefa"
                   id="tipoTarefa"/>

            <label>DATA DE CADASTRO</label>
            <input type="text"
                   name="dataTarefa"
                   id="dataTarefa"/>

            <label>DATA PARA TERMINO</label>
            <input type="text"
                   name="dataTerminoTarefa"
                   id="dataTerminoTarefa"/>

            <label>STATUS</label>
            <input type="text"
                   name="statusTarefa"
id="statusTarefa"/>


<button id="btnCadastrarTarefa">
    + Cadastrar Tarefa
</button>
</div>
</div>

<div id="caixaTarefas" class="caixa2">
    <div id="caixaEditarTarefas" class="caixaFuncionalidades">

        <button2 id="btnEditarTarefa">
            Editar
        </button2>

        <button3 id="btnDeletarTarefa">
            Excluir
        </button3>

        <statusFinalizado id="statusFinalizado">
            FINALIZADO
        </statusFinalizado>

        <statusNaoIniciado id="statusNaoIniciado">
            NÃO INICIADO
        </statusNaoIniciado>

        <statusEmAndamento id="statusEmAndamento">
            EM ANDAMENTO
        </statusEmAndamento>

        <prazoEmDia id="prazoEmDia">
            EM DIA
        </prazoEmDia>

    </div>
</div>


</main>

<script src="desafio%20TABELA.html"></script>

</body>
</html>
