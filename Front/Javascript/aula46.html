<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 45</title>
    <link rel="stylesheet" href="aula46.css">
</head>
<body>
<main>

    <!-- Caixa de funcionalidades -->
    <div id="caixaNovoFuncionalidades" class="caixa">

        <div id="caixaNovoCurso" class="caixaFuncionalidades">
            <label for="nomeCurso">Nome do curso</label>

            <input
                    type="text"
                    id="nomeCurso"
                    placeholder="Digite o nome do curso"
            >
            <button id="btnAdicionarAntes">
                Adicionar Antes
            </button>

            <button id="btnAdicionarDepois">
                Adicionar Depois
            </button>
        </div>

        <div id="caixaRemoverCurso" class="caixaFuncionalidades">
            <button id="btnRemoverCurso">
                Remover Selecionado
            </button>
        </div>

        <div id="caixaCursoSelecionado" class="caixaFuncionalidades">
            <button id="btnCursosSelecionados">
                Curso Selecionado
            </button>
        </div>
    </div>
    <div id="caixaCursos" class="caixa">

        <div id="caixaCurso">
        </div>
    </div>
</main>

<script src="aula46.js"></script>

</body>
</html>
