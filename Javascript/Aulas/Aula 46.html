<!DOCTYPE html>

<body>
<main>
    <div id="caixaNovoFuncionalidades" class="caixa">

        <div id="caixaNovoCurso" class="caixaFuncionalidades">
            <label for="nomeCurso">𝙉𝙤𝙢𝙚 𝙙𝙤 𝙘𝙪𝙧𝙨𝙤</label>

            <input
                    type="text"
                    id="nomeCurso"
                    placeholder="⮩𝗗𝗶𝗴𝗶𝘁𝗲 𝗼 𝗻𝗼𝗺𝗲 𝗱𝗼 𝗰𝘂𝗿𝘀𝗼 𝗮𝗾𝘂𝗶 ⮨"
            >
            <button id="btnAdicionarAntes">
                𝘼𝙙𝙞𝙘𝙞𝙤𝙣𝙖𝙧 𝘼𝙣𝙩𝙚𝙨
            </button>

            <button id="btnAdicionarDepois">
                𝘼𝙙𝙞𝙘𝙞𝙤𝙣𝙖𝙧 𝘿𝙚𝙥𝙤𝙞𝙨
            </button>
        </div>

        <div id="caixaRemoverCurso" class="caixaFuncionalidades">
            <button id="btnRemoverCurso">
                𝙍𝙚𝙢𝙤𝙫𝙚𝙧 𝙎𝙚𝙡𝙚𝙘𝙞𝙤𝙣𝙖𝙙𝙤
            </button>
        </div>

        <div id="caixaCursoSelecionado" class="caixaFuncionalidades">
            <button id="btnCursosSelecionados">
                𝘾𝙪𝙧𝙨𝙤 𝙎𝙚𝙡𝙚𝙘𝙞𝙤𝙣𝙖𝙙𝙤
            </button>
        </div>
    </div>
    <div id="caixaCursos" class="caixa">

        <div id="caixaCurso">
        </div>
    </div>
</main>

<script src="Aula%2046.js"></script>

</body>
