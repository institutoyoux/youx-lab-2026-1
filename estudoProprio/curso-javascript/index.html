<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto final javscript - Curso javascript cfb cursos</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&display=swap"
        rel="stylesheet">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>
    <main>
        <i class="bx bx-menu"></i>
        <section class="display" id="display">
            <span id="valor1">0</span>
            <span class="sinal"></span>
        </section>
        <section class="actions">
            <div class="act c1" act="limpar">AC</div>
            <div class="act c1" act="sinal">+/-</div>
            <div class="act c1" act="sinal">%</div>
            <div class="act yellow" act="sinal">÷</div>
            <div class="act c2" act="number">7</div>
            <div class="act c2" act="number">8</div>
            <div class="act c2" act="number">9</div>
            <div class="act yellow" act="sinal">X</div>
            <div class="act c2" act="number">4</div>
            <div class="act c2" act="number">5</div>
            <div class="act c2" act="number">6</div>
            <div class="act yellow" act="sinal">-</div>
            <div class="act c2" act="number">1</div>
            <div class="act c2" act="number">2</div>
            <div class="act c2" act="number">3</div>
            <div class="act yellow" act="sinal">+</div>
            <div class="act c2"></div>
            <div class="act c2" act="number">0</div>
            <div class="act c2" act="number">,</div>
            <div class="act yellow" act="total">=</div>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
