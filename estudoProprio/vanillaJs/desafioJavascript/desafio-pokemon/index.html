<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio pokemon</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&display=swap"
        rel="stylesheet">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.6.0/axios.min.js"></script>
</head>

<body>
    <form>
        <h1>Busque por seu Pokemon favorito!</h1>
        <div> 
            <div class="campos"><input type="text" id="nome"><button type="submit"><i class="bx bx-right-arrow-alt"></i></button></div>
            <div class="sugestao"></div>
        </div>

    </form>
    <main>
        <img class="background" src="background.png">
        <section class="dados">
            <div class="status"><span class="name">Blastoide</span><span class="hp"></span></div>
            <div class="foto"><img
                    src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/back/9.png" alt="">
            </div>
            <div class="habilidade"><span class="tipo">Ability</span>Powerful Squall</div>
            <span class="last">Hydro Tackle</span>
        </section>
    </main>
    <script src="script.js"></script>
</body>

</html>
