<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Projeto bet</title>
    <link rel="stylesheet" href="/auth/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&display=swap"
        rel="stylesheet">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.6.0/axios.min.js"></script>
</head>
<body>
    <header><img class="logo" src="/images/logo.png"></header>
    <main>
        <h1 class="title">Abra sua conta</h1>
        <p class="desc">Digite seu e-mail para começar</p>
        <form>
            <label for="name">Nome completo</label>
            <input type="text" name="name" id="name" required placeholder="Informe seu nome">
            <label for="email">Email</label>
            <input type="email" name="email" id="email" required placeholder="Informe seu e-mail">
            <label for="password">Senha</label>
            <input type="password" name="password" id="password" required placeholder="Informe sua senha" minlength="8">
            <label for="password">Confirme a senha</label>
            <input type="password" name="confirm" id="confirm" required placeholder="Informe sua senha" minlength="8">
            <label for="date">Data Nascimento</label>
            <input type="date" name="date" id="date" required>
            <button class="submit" act="signup" disabled>Continuar</button>
        </form>
        <div class="or"><div class="line"></div>ou<div class="line"></div></div>
        <span class="link">Já tem conta? <a href="/auth/login/">Entre</a></span>
    </main>
    <script src="/script/api.js"></script>
    <script src="/auth/script/script.js"></script>
</body>
</html>
