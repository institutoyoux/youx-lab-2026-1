<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Projeto bet</title>
    <link rel="stylesheet" href="/auth/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&display=swap"
        rel="stylesheet">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.6.0/axios.min.js"></script>
</head>

<body>
    <header><img class="logo" src="/images/logo.png"></header>
    <main>
        <h1 class="title">Entre na sua conta</h1>
        <p class="desc">Digite seu e-mail e senha para entrar</p>
        <form>
            <label for="email">Email</label>
            <input type="email" name="email" id="email" required placeholder="Informe seu e-mail">
            <label for="password">Senha</label>
            <div class="eye">
                <input type="password" name="password" id="password" required placeholder="Informe sua senha"
                    minlength="8">
                <i class="bx bx-show"></i>
            </div>
            <a href="/auth/lost/" class="lost">Esqueceu a senha?</a>
            <button class="submit" act="login" disabled>Continuar</button>
        </form>
        <div class="or">
            <div class="line"></div>ou<div class="line"></div>
        </div>
        <span class="link">Não tem conta? <a href="/auth/signup/">Crie uma</a></span>
    </main>
    <script src="/script/api.js"></script>
    <script src="/auth/script/script.js"></script>
</body>

</html>
