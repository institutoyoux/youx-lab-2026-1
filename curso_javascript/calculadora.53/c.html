<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>calculadora</title>
    <link rel="stylesheet" type="text/css" href="c.css">
</head>
<body>
    <div id="valores">
        <div>
            <label for="v1">Valor 1</label>
            <input type="number" id="v1" name="v1">
        </div>
        <div>
            <label for="v2">Valor 2</label>
            <input type="number" id="v2" name="v2">
        </div>
        <div>
            <label for="resultado">Resultado: </label>
            <span id="resultado" type="number" ></span>
            <!-- <input type="number" id="resultado" name="resultado"> -->
        </div>
        <button id="somar">+</button>
        <button id="subtrair">-</button>
        <button id="multiplicar">*</button>
        <button id="dividir">/</button>
        <button id="potencia">^</button>
    </div>
    <script src="c.js"></script>
</body>
</html>
