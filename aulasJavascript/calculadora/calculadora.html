<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compartible" content="IE-edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Calculadora Aula 53</title>
        <link rel="stylesheet" type="text/css" href="calculadora.css" />
    </head>
    <body>
        <div class="operaçoes">
            <label>Operacao 1</label>
            <input type="text" id="operacao1" name="operacao1"/>
        </div>
        <div class="operaçoes">
            <label>Operacao 2</label>
            <input type="text" id="operacao2" name="operacao2"/>
        </div>
        <div class="operaçoes">
            <label>Resultado</label>
            <input type="text" id="resultado" name="resultado"/>
        <div class="botoes">
            <button id="btn_multiplicacao">*</button>
            <button id="btn_soma">+</button>
            <button id="btn_divisão">/</button>
            <button id="btn_subtração">-</button>
        </div>
           

       <script src="calculadora.js"></script>
    </body>
</html>
