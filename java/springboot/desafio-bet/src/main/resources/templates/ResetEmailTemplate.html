<table width="100%" cellpadding="0" cellspacing="0" style="font-family: Arial, sans-serif; background-color: #f7f7f7; padding: 40px 20px;">
    <tr>
        <td align="center">
            <table width="100%" cellpadding="0" cellspacing="0" style="max-width: 420px; background: #ffffff; border-radius: 12px; padding: 40px;">

                <tr>
                    <td align="center">
                        <img
                                src="cid:estudante.png"
                                alt="Logo"
                                width="80"
                                style="display: block; margin-bottom: 28px;"
                        >

                        <h2 style="margin: 0 0 10px; color: #111111; font-size: 22px;">
                            Redefinição de senha
                        </h2>

                        <p style="margin: 0 0 28px; color: #666666; font-size: 14px; line-height: 1.6;">
                            Use o código abaixo para redefinir sua senha.
                        </p>

                        <div style="
                            background: #f5f5f5;
                            border-radius: 8px;
                            padding: 18px;
                            margin-bottom: 24px;
                            text-align: center;
                        ">
                            <span style="
                                font-size: 28px;
                                font-weight: 700;
                                letter-spacing: 6px;
                                color: #111111;
                            ">
                                ${codigo}
                            </span>
                        </div>

                        <p style="margin: 0; color: #999999; font-size: 12px; line-height: 1.5;">
                            Este código é válido por alguns minutos.<br>
                            Se você não solicitou esta alteração, ignore este e-mail.
                        </p>

                    </td>
                </tr>

            </table>
        </td>
    </tr>
</table>
