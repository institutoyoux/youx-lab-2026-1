<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:#000;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .card{
            width:380px;
            background:#111;
            border-radius:24px;
            padding:40px 30px;
            box-shadow:0 15px 40px rgba(255,255,255,.08);
        }

        .logo{
            width:70px;
            height:70px;
            border:2px solid #fff;
            border-radius:18px;
            margin:0 auto 25px;
            display:flex;
            align-items:center;
            justify-content:center;
            color:#fff;
            font-size:28px;
            font-weight:bold;
        }

        h1{
            color:#fff;
            font-size:28px;
            margin-bottom:35px;
            text-align:center;
        }

        .input-group{
            margin-bottom:20px;
        }

        label{
            color:#bbb;
            display:block;
            margin-bottom:8px;
            font-size:14px;
        }

        input{
            width:100%;
            height:52px;
            border:none;
            border-bottom:2px solid #444;
            background:transparent;
            color:#fff;
            font-size:16px;
            outline:none;
            transition:.3s;
        }

        input:focus{
            border-color:#fff;
        }

        button,a.go{
            width:100%;
            height:55px;
            margin-top:25px;
            border:none;
            border-radius:14px;
            background:#fff;
            color:#000;
            font-size:17px;
            font-weight:bold;
            cursor:pointer;
            transition:.3s;
        }

        button:hover{
            background:#ddd;
        }

        .forgot{
            display:block;
            text-align:center;
            margin-top:20px;
            color:#fff;
            text-decoration:none;
            font-size:14px;
        }

        .forgot:hover{
            text-decoration:underline;
        }
    </style>
</head>

<body>

<div class="card">

    <h1>Entrar</h1>

    <form method="post" th:action="@{/login}">

        <div class="input-group">
            <label>E-mail</label>
            <input
                    type="text"
                    placeholder="Digite seu e-mail"
                    id="username"
                    name="username"
                    required>
        </div>

        <div class="input-group">
            <label>Senha</label>
            <input
                    type="password"
                    placeholder="Digite sua senha"
                    id="password"
                    name="password"
                    required>
        </div>

        <button type="submit">
            Continuar
        </button>

        <a href="#" class="forgot">
            Esqueci minha senha
        </a>

    </form>

    <a th:href="@{/oauth2/authorization/google}" class="go">Entrar com google</a>

</div>

</body>
</html>
